openapi: 3.1.0
info:
  title: API Fatura
  description: "Lê faturas/extratos em PDF, salva as compras no banco e permite consultá\
    -las, ordená-las, filtrá-las e ver a distribuição dos gastos por categoria."
servers:
- url: http://localhost:8080
  description: Generated server url
tags:
- name: Compras
  description: "Consulta, ordenação, filtro e análise das compras salvas"
- name: Faturas
  description: Processamento e exclusão das faturas
paths:
  /faturas:
    post:
      tags:
      - Faturas
      summary: Processa o PDF e salva as compras
      description: "Lê o arquivo fixo fatura/itau_extrato.pdf, extrai data, descriç\
        ão e valor de cada lançamento, classifica a categoria, cria uma Fatura e salva\
        \ as compras. Cada chamada cria uma nova fatura: chamar duas vezes duplica\
        \ as compras."
      operationId: processarFatura
      responses:
        "200":
          description: Compras criadas
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Compra"
        "500":
          description: Erro ao ler o PDF (arquivo ausente ou inválido)
          content:
            text/plain:
              example: "Erro ao ler ou processar arquivo: fatura/itau_extrato.pdf"
  /compras:
    get:
      tags:
      - Compras
      summary: Lista todas as compras
      description: Devolve todas as compras salvas no banco.
      operationId: getCompras
      responses:
        "200":
          description: Lista de compras
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Compra"
        "404":
          description: Não há nenhuma compra salva
          content:
            text/plain:
              example: Nenhuma compra encontrada
  /compras/ordenado/decrescente:
    get:
      tags:
      - Compras
      summary: Lista as compras da maior para a menor
      description: "Ordena pelo valor, em ordem decrescente."
      operationId: getComprasOrdenadoDescendente
      responses:
        "200":
          description: Lista de compras ordenada por valor decrescente
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Compra"
        "404":
          description: Não há nenhuma compra salva
          content:
            text/plain:
              example: Nenhuma compra encontrada
  /compras/ordenado/crescente:
    get:
      tags:
      - Compras
      summary: Lista as compras da menor para a maior
      description: "Ordena pelo valor, em ordem crescente (os gastos, que são negativos,\
        \ vêm primeiro)."
      operationId: getComprasOrdenadoCrescente
      responses:
        "200":
          description: Lista de compras ordenada por valor crescente
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Compra"
        "404":
          description: Não há nenhuma compra salva
          content:
            text/plain:
              example: Nenhuma compra encontrada
  /compras/distribuicao:
    get:
      tags:
      - Compras
      summary: Distribuição dos gastos por categoria
      description: "Soma os gastos (compras de valor negativo) de cada categoria e\
        \ informa o total e o percentual sobre o total de gastos, do maior para o\
        \ menor. Entradas (valor positivo) são ignoradas."
      operationId: getDistribuicaoGastos
      responses:
        "200":
          description: Categorias com total e percentual
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoriaGasto"
        "404":
          description: Não há nenhum gasto (banco vazio ou só entradas)
          content:
            text/plain:
              example: Nenhum gasto encontrado
  /compras/categoria/{categoria}:
    get:
      tags:
      - Compras
      summary: Filtra as compras por categoria
      description: Devolve só as compras da categoria informada.
      operationId: getComprasPorCategoria
      parameters:
      - name: categoria
        in: path
        description: Nome da categoria
        required: true
        schema:
          type: string
        example: Pix
      responses:
        "200":
          description: Compras da categoria
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Compra"
        "404":
          description: Nenhuma compra na categoria informada
          content:
            text/plain:
              example: "Nenhuma compra encontrada para a categoria: Viagem"
  /faturas/deleta:
    delete:
      tags:
      - Faturas
      summary: Apaga todas as compras e faturas
      description: Remove todos os dados salvos no banco.
      operationId: deleteAll
      responses:
        "204":
          description: Dados apagados (sem corpo na resposta)
components:
  schemas:
    Compra:
      type: object
      description: Lançamento extraído de uma fatura ou extrato
      properties:
        id:
          type: integer
          format: int64
          description: Identificador da compra
          example: 1
        data:
          type: string
          format: date
          description: Data do lançamento
          example: 2026-08-10
        valor:
          type: number
          description: "Valor do lançamento (negativo = gasto, positivo = entrada)"
          example: -120.0
        categoria:
          type: string
          description: Categoria atribuída pelo início da descrição
          example: Pix
        descricao:
          type: string
          description: Descrição extraída do PDF
          example: PIX TRANSF RENATA 10/08
        fatura:
          $ref: "#/components/schemas/Fatura"
          description: Fatura (processamento do PDF) à qual a compra pertence
    Fatura:
      type: object
      description: Um processamento de PDF; agrupa as compras extraídas
      properties:
        id:
          type: integer
          format: int64
          description: Identificador da fatura
          example: 1
        dataUpload:
          type: string
          format: date
          description: Data em que a fatura foi processada
          example: 2026-10-13
    CategoriaGasto:
      type: object
      description: Gasto total de uma categoria e sua participação no total de gastos
      properties:
        categoria:
          type: string
          description: Nome da categoria
          example: Pix
        total:
          type: number
          description: Soma dos gastos da categoria
          example: 1229.01
        percentual:
          type: number
          format: double
          description: Percentual sobre o total de gastos (0 a 100)
          example: 34.17
